<div id="site-pet" class="site-pet" hidden
     data-spritesheet="{{ base_path }}/assets/pet/remiel-v3/spritesheet-continuity-20260907.webp">
  <button class="site-pet__sprite" type="button"
          aria-label="Pet Remielle. Drag to move, or use the arrow keys."></button>
  <span class="site-pet__hearts" aria-hidden="true" hidden>♡</span>
  <button class="site-pet__toggle" type="button" aria-label="Remielle's controls"
          aria-expanded="false" aria-controls="site-pet-controls"><span aria-hidden="true">···</span></button>
  <div id="site-pet-controls" class="site-pet__controls" role="group" aria-label="Remielle's controls" hidden>
    <button type="button" data-pet-action="pet" aria-label="Pet Remielle"><span aria-hidden="true">♡</span></button>
    <button type="button" data-pet-action="write" aria-label="Write"><span aria-hidden="true">✎</span></button>
    <button type="button" data-pet-action="wander" aria-label="Wander" aria-pressed="false"><span aria-hidden="true">↔</span></button>
    <button type="button" data-pet-action="pause" aria-label="Pause animation" aria-pressed="false">
      <svg data-pause-icon aria-hidden="true" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>
      <svg data-play-icon aria-hidden="true" viewBox="0 0 24 24" hidden><path d="m8 5 11 7-11 7Z"/></svg>
    </button>
    <button type="button" data-pet-action="hide" aria-label="Tuck away"><span aria-hidden="true">−</span></button>
  </div>
</div>
<button id="site-pet-restore" class="site-pet-restore" type="button" aria-label="Bring Remielle back" hidden>
  <span aria-hidden="true">✦</span>
</button>
<script src="{{ base_path }}/assets/js/site-pet.js" defer></script>
